<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Apri offerta in App</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; text-align: center; padding: 30px 15px; }
        .box { background: white; padding: 30px 20px; border-radius: 16px; max-width: 400px; margin: 40px auto; box-shadow: 0 4px 15px rgba(0,0,0,.08); }
        .btn { display: inline-block; background: #ff9900; color: #111; padding: 16px 30px; font-size: 18px; font-weight: bold; border-radius: 10px; text-decoration: none; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Offerta Pronta!</h2>
        <p>Apri l'offerta direttamente nell'app ufficiale.</p>
        <a id="btn-amazon" href="#" onclick="openAmazon(event)" class="btn">🛒 APRI IN APPLICAZIONE</a>
        <p style="font-size:12px;color:#555;line-height:1.4;margin-top:25px;font-weight:500;">⚖️ In qualità di Affiliato Amazon, ricevo un guadagno per ciascun acquisto idoneo.</p>
    </div>

    <script>
        // Legge ASIN ed eventuale Venditore (m) dall'URL (es: go.html?asin=B0XXXXX&m=A1HO9729ND375Y)
        const urlParams = new URLSearchParams(window.location.search);
        const asin = urlParams.get('asin');
        const merchant = urlParams.get('m');
        const tag = "offerteita07-21";
        
        let link_nativo = "";
        let url_android = "";
        let url_ios = "";

        if (asin) {
            // Costruisce la query string includendo 'm' se presente
            let param_merchant = merchant ? `&m=${merchant}` : "";

            link_nativo = `https://www.amazon.it/dp/${asin}/?tag=${tag}${param_merchant}`;
            url_android = `intent://www.amazon.it/dp/${asin}/?tag=${tag}${param_merchant}#Intent;scheme=https;package=com.amazon.mShop.android.shopping;end`;
            url_ios = `com.amazon.mobile.shopping://www.amazon.it/dp/${asin}/?tag=${tag}${param_merchant}`;
        } else {
            // Fallback se l'ASIN manca
            link_nativo = `https://www.amazon.it/?tag=${tag}`; 
        }

        document.getElementById('btn-amazon').href = link_nativo;

        function openAmazon(e) {
            if (!asin) return; // Se non c'è ASIN, naviga normalmente
            var u = navigator.userAgent;
            if (/android/i.test(u)) {
                e.preventDefault();
                window.location.href = url_android;
            } else if (/iPad|iPhone|iPod/.test(u)) {
                e.preventDefault();
                window.location.href = url_ios;
            }
        }
    </script>
</body>
</html>
