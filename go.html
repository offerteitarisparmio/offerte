<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Apri offerta in App</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; text-align: center; padding: 30px 15px; }
        .box { background: white; padding: 30px 20px; border-radius: 16px; max-width: 400px; margin: 40px auto; box-shadow: 0 4px 15px rgba(0,0,0,.08); }
        .btn { display: inline-block; background: #ff9900; color: #111; padding: 16px 30px; font-size: 18px; font-weight: bold; border-radius: 10px; text-decoration: none; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Offerta Pronta!</h2>
        <p>Apri l'offerta direttamente nell'app ufficiale.</p>
        <a id="btn-amazon" href="#" onclick="openAmazon(event)" class="btn">🛒 APRI IN APPLICAZIONE</a>
        <p style="font-size:12px;color:#555;line-height:1.4;margin-top:25px;font-weight:500;">⚖️ In qualità di Affiliato Amazon, ricevo un guadagno per ciascun acquisto idoneo.</p>
    </div>

    <script>
        // Legge URL diretto (Modalità Tradizionale) oppure ASIN ed eventuale Venditore (m o smid)
        const urlParams = new URLSearchParams(window.location.search);
        const directUrl = urlParams.get('url');
        const asin = urlParams.get('asin');
        const merchant = urlParams.get('m');
        const smid = urlParams.get('smid');
        const tag = "offerteita07-21";
        
        let link_nativo = "";
        let url_android = "";
        let url_ios = "";

        if (directUrl) {
            // Modalità Tradizionale: mantiene il link esatto al 100% senza toccarlo
            link_nativo = directUrl;
            if (directUrl.includes("amazon.it")) {
                const pathPulito = directUrl.replace(/^https?:\/\//, '');
                url_android = `intent://${pathPulito}#Intent;scheme=https;package=com.amazon.mShop.android.shopping;end`;
                url_ios = `com.amazon.mobile.shopping://${pathPulito}`;
            } else {
                // Per link brevi (amzn.to) o altri store (eBay, AliExpress, ecc.) apre direttamente il link
                url_android = directUrl;
                url_ios = directUrl;
            }
        } else if (asin) {
            let extra_params = "";
            if (smid) {
                extra_params += `&smid=${smid}`;
            } else if (merchant) {
                extra_params += `&m=${merchant}`;
            }

            const query_finale = `tag=${tag}&creatorsDisableRedirect=true&psc=1${extra_params}`;

            link_nativo = `https://www.amazon.it/dp/${asin}/?${query_finale}`;
            url_android = `intent://www.amazon.it/dp/${asin}/?${query_finale}#Intent;scheme=https;package=com.amazon.mShop.android.shopping;end`;
            url_ios = `com.amazon.mobile.shopping://www.amazon.it/dp/${asin}/?${query_finale}`;
        } else {
            // Fallback se mancano sia url che asin
            link_nativo = `https://www.amazon.it/?tag=${tag}&creatorsDisableRedirect=true&psc=1`; 
        }

        document.getElementById('btn-amazon').href = link_nativo;

        function openAmazon(e) {
            if (!asin && !directUrl) return; // Se non c'è né ASIN né URL diretto, naviga normalmente
            var u = navigator.userAgent;
            if (/android/i.test(u)) {
                e.preventDefault();
                window.location.href = url_android;
            } else if (/iPad|iPhone|iPod/.test(u)) {
                e.preventDefault();
                window.location.href = url_ios;
            }
        }
    </script>
</body>
</html>
