<script>
function openAmazon(e) {
    var userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const webUrl = "https://www.amazon.it/gp/css/homepage.html?&linkCode=sl2&tag=offerteita07-21&linkId=2c0ed5db9e177cefffddcc76b7b1788e&ref_=as_li_ss_tl";
    const androidUrl = "https://www.amazon.it/gp/css/homepage.html?&linkCode=sl2&tag=offerteita07-21&linkId=2c0ed5db9e177cefffddcc76b7b1788e&ref_=as_li_ss_tl";
    const iosUrl = "https://www.amazon.it/gp/css/homepage.html?&linkCode=sl2&tag=offerteita07-21&linkId=2c0ed5db9e177cefffddcc76b7b1788e&ref_=as_li_ss_tl";

    if (/android/i.test(userAgent)) {
        e.preventDefault();
        window.location.href = androidUrl;
        setTimeout(function () { window.location.href = webUrl; }, 1500);
    } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        e.preventDefault();
        window.location.href = iosUrl;
        setTimeout(function () { window.location.href = webUrl; }, 1500);
    }
}

window.onload = function() {
    if (!navigator.userAgent.includes("FBAN") && !navigator.userAgent.includes("FBAV")) {
        var userAgent = navigator.userAgent || navigator.vendor || window.opera;
        if (/android/i.test(userAgent)) {
            window.location.href = "https://www.amazon.it/gp/css/homepage.html?&linkCode=sl2&tag=offerteita07-21&linkId=2c0ed5db9e177cefffddcc76b7b1788e&ref_=as_li_ss_tl";
        } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {

        } else {

        }
    }
}
