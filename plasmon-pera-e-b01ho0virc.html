<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apri offerta Amazon</title>

<meta property="og:title" content="Apri l'offerta">
<meta property="og:type" content="website">
<meta property="og:url" content="https://offerteitarisparmio.github.io/offerte/plasmon-pera-e-b01ho0virc.html">

<style>
body {
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    padding:30px;
    text-align:center;
}
.box {
    background:white;
    padding:25px;
    border-radius:15px;
    max-width:450px;
    margin:auto;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}
button {
    background:#ff9900;
    border:none;
    padding:15px 25px;
    font-size:18px;
    font-weight:bold;
    border-radius:8px;
    cursor:pointer;
    margin-top:20px;
    color: #111;
}
</style>
</head>
<body>

<div class="box">
<h2>Apri l'offerta Amazon</h2>
<p>Stiamo aprendo l'offerta nell'applicazione...</p>

<button onclick="openAmazon()">
Apri nell'app Amazon
</button>

<p style="font-size:12px;margin-top:20px;">
Se non si apre automaticamente, premi il pulsante sopra.
</p>
</div>

<script>
function openAmazon() {
    const webUrl = "https://www.amazon.it/dp/B01HO0VIRC";
    const androidUrl = "intent://www.amazon.it/dp/B01HO0VIRC/#Intent;scheme=https;package=com.amazon.mShop.android.shopping;end";
    const iosUrl = "com.amazon.mobile.shopping://www.amazon.it/dp/B01HO0VIRC";
    
    var userAgent = navigator.userAgent || navigator.vendor || window.opera;

    // Tenta il salto diretto verso l'app in base al sistema operativo
    if (/android/i.test(userAgent)) {
        window.location.href = androidUrl;
    } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        window.location.href = iosUrl;
    } else {
        window.location.href = webUrl;
    }

    // Fallback sicuro sul browser se l'app manca o è bloccata
    setTimeout(function () {
        window.location.href = webUrl;
    }, 1500);
}

// Auto-apertura ritardata per i browser normali (salta l'auto-open aggressivo su FB)
setTimeout(function () {
    if (!navigator.userAgent.includes("FBAN") && !navigator.userAgent.includes("FBAV")) {
        openAmazon();
    }
}, 800);
</script>

</body>
</html>
